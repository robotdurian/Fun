<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sorting Hat</title>
<style>
:root{--ink:#6b6480;--dim:#3a3548;--gold:#8a6d2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:Georgia,serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
button,select{font:inherit}
#big{background:transparent;color:var(--gold);border:2px solid var(--dim);border-radius:24px;width:min(80vw,340px);padding:36px 12px;font-size:1.5rem}
#big:active{background:#111}
#status{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:16px;right:60px;font-size:.8rem;color:var(--dim);min-height:1.2em}
#cap{position:fixed;left:16px;right:16px;bottom:120px;text-align:center;color:var(--ink);font-size:1.1rem;display:none}
body.caps #cap{display:block}
#keypad{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:none;justify-content:center;gap:14px}
#keypad button{width:64px;height:64px;border-radius:50%;background:transparent;border:2px solid var(--dim);color:var(--ink);font-size:1.4rem}
#keypad button:active{background:#1a1a22}
details{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:10px;text-align:right}
summary{list-style:none;cursor:pointer;color:var(--dim);font-size:1.4rem;padding:4px 8px}
summary::-webkit-details-marker{display:none}
.panel{background:#0b0a10;border:1px solid var(--dim);border-radius:12px;padding:12px;margin-top:6px;text-align:left;width:min(88vw,320px);font-size:.95rem;color:var(--ink)}
.panel label,.panel div{display:block;margin:8px 0}
.panel select{width:100%;background:#000;color:var(--ink);border:1px solid var(--dim);border-radius:8px;padding:6px}
.panel button{background:transparent;color:var(--ink);border:1px solid var(--dim);border-radius:8px;padding:6px 10px;margin:2px}
</style>
</head>
<body>
<div id="status"></div>
<details id="menu"><summary aria-label="Settings">⚙</summary>
  <div class="panel">
    <label><input type="checkbox" id="micChk"> Listen for spoken answers</label>
    <label><input type="checkbox" id="capChk"> Show captions</label>
    <label><input type="checkbox" id="noiseChk" checked> Pause when the room is too noisy</label>
    <div>Noise limit <input type="range" id="noiseRange" min="-60" max="-10" value="-34" style="width:100%"><span id="noiseVal"></span></div>
    <div><button id="noiseTest">Check room</button><button id="noiseSet">Set limit from room</button></div>
    <div id="noiseOut" style="font-size:.85rem;color:var(--dim)"></div>
    <label>Length <select id="lenSel"><option value="5">Short (5)</option><option value="6" selected>Normal (6)</option><option value="8">Long (8)</option></select></label>
    <label>Hat voice <select id="voiceSel"></select></label>
    <div><button id="voiceTest">Test voice</button><button id="scoreBtn">Speak scores</button></div>
    <div><button id="clearBtn">Clear scores</button><button id="stopBtn">Stop / reset</button></div>
    <div id="voiceNote" style="font-size:.8rem;color:var(--dim)"></div>
  </div>
</details>
<button id="big">Wake the Hat</button>
<div id="cap"></div>
<div id="keypad"></div>

<script>
"use strict";
/* ================= DATA ================= */
const H = {
  G:{name:"Gryffindor",emoji:"🦁",color:"var(--gry)",traits:["Brave","Daring","Loud (affectionate)"],
     dare:"HOUSE DARE: Give your very best lion ROAR. Everyone must hear it!",
     cheer:"Better be… GRYFFINDOR!"},
  H:{name:"Hufflepuff",emoji:"🦡",color:"var(--huf)",traits:["Kind","Loyal","Snack-sharer"],
     dare:"HOUSE DARE: Give a genuine compliment to someone in the room. Right now!",
     cheer:"Better be… HUFFLEPUFF!"},
  R:{name:"Ravenclaw",emoji:"🦅",color:"var(--rav)",traits:["Clever","Curious","Full of weird facts"],
     dare:"HOUSE DARE: Make up a riddle and stump the room.",
     cheer:"Better be… RAVENCLAW!"},
  S:{name:"Slytherin",emoji:"🐍",color:"var(--sly)",traits:["Cunning","Ambitious","Excellent plans"],
     dare:"HOUSE DARE: Invent a secret handshake for your house. Recruit a partner!",
     cheer:"Better be… SLYTHERIN!"}
};
// o = [house, text, hat's ramble about that answer]  ({n} = the child's wizard name)
const QS = [
 {q:"A giant cake appears, and there is only ONE slice left. You…",
  o:[["G","Grab it before a dragon does","You grabbed the last slice of cake like a dragon guarding gold. Bold. Slightly sticky."],
     ["H","Cut it up so everyone gets a bite","You split the cake so everyone got a bite. Hufflepuffs would weep happy tears."],
     ["R","Calculate the fairest way to cut it","You did MATHS on a cake. Magnificent. Slightly worrying."],
     ["S","Trade it for something even better","You swapped cake for something better. I respect the hustle, {n}."]]},
 {q:"You find a mysterious glowing door. What now?",
  o:[["G","Fling it open immediately!","You flung that door open without a second thought. My brim is trembling."],
     ["H","Grab a friend first. Doors are scarier alone","You brought a friend to the spooky door. Smart. Sweet. Probably smells of biscuits."],
     ["R","Read the runes and clues on it first","You studied the door before touching it. I love a nerd. Said with deep affection."],
     ["S","Look for the secret shortcut around it","You hunted for a sneaky shortcut. Rules are more like suggestions, hmm?"]]},
 {q:"Your team is losing the party game. Your move?",
  o:[["G","Try something wild and risky","Your team was losing, so you did something WILD. The lion in you is roaring."],
     ["H","Cheer for everybody, win or lose","Your team was losing and you cheered anyway. Teammates like you are worth gold."],
     ["R","Figure out the other team's pattern","You spotted the other team's pattern. Cheeky. Brainy. Annoyingly effective."],
     ["S","Quietly come up with a master plan","You hatched a master plan. I heard the evil cackle, don't deny it."]]},
 {q:"Pick your magical pet!",
  o:[["G","A fire phoenix that sets things ablaze","A fire phoenix? Brave choice. Our curtains will never recover."],
     ["H","A fluffy creature that follows you around","A fluffy pet that follows you everywhere. Adorable. Your house is going to be very squishy."],
     ["R","A talking owl that knows everything","An owl who knows everything. You want the cheat codes to life. Smart."],
     ["S","A sneaky snake that hisses secrets","A snake that whispers secrets. Ooh. I'd watch my back around you, {n}."]]},
 {q:"Someone is being left out at the party. You…",
  o:[["G","Stand up and invite them in, loudly","You marched over and invited them in, loudly. Subtle as a troll, kind as a unicorn."],
     ["H","Sit with them and keep them company","You sat with them. That's the best kind of magic, and it's free."],
     ["R","Think about why and find a way to help","You worked out how to help them. A thinker AND a helper. Rare."],
     ["S","Quietly sort it out so they're included","You quietly fixed it behind the scenes. A hero in the shadows. Very you."]]},
 {q:"Choose your superpower!",
  o:[["G","Fly faster than anything","You want to fly faster than anything. Speed demon! Watch out for owls."],
     ["H","Make everyone feel happy","You want to make everyone happy. Honestly, the world needs that. Hmph, I'm tearing up."],
     ["R","Know the answer to everything","You want to know everything. Oh, the cheek. Oh, the brain on you."],
     ["S","Get any wish granted","You want any wish granted. Greedy and brilliant. Never change."]]},
 {q:"Rainy day at Hogwarts. What sounds best?",
  o:[["G","An epic adventure game","You picked an epic adventure game on a rainy day. Of course you did."],
     ["H","Baking treats to share","Baking treats to share! I smell cinnamon and good character."],
     ["R","Curling up with a mystery book","You'd curl up with a mystery book. Please recommend one. I have no hands."],
     ["S","Building the biggest blanket fort ever","You'd build the biggest blanket fort in history, and rule it. Obviously."]]},
 {q:"What do you want your friends to say about you?",
  o:[["G","\"You are SO brave!\"","You'd love to be called brave. Funny, so did I, until I became a hat."],
     ["H","\"You are SO kind!\"","You want to be known as kind. That's the strongest magic of all."],
     ["R","\"You are SO clever!\"","You want to be called clever. Well. I'm a hat. I have opinions on that."],
     ["S","\"You never give up!\"","You want to be known for never giving up. I can feel the determination from here."]]}
];
const ADJ = ["Wobbly","Sparkly","Grumpy","Fluffy","Mighty","Sneaky","Giggly","Thunder","Mystic","Cosmic","Zesty","Moonlit"];
const NOUN = ["Wombat","Pickle","Wand","Dragon","Biscuit","Goblin","Owl","Noodle","Cauldron","Toad","Broomstick","Potion"];
const TITLE = ["Professor","Captain","Lord","Lady","Sir","Madam","Wizard","Baron"];
const roll = () => { const r=a=>a[Math.floor(Math.random()*a.length)]; return `${r(TITLE)} ${r(ADJ)} ${r(NOUN)}`; };

const ACKS = ["Hm.","Interesting…","Mmm hm.","Ooh.","Noted.","Oh, very telling.","Ha! Well, well."];
const HOUSE_RE = {G:/gr[iy]ff|gry|griff|lion/, H:/huff|puff|badger/, R:/raven|claw|eagle/, S:/sly|slith|snake/};
const NUMS = ["One","Two","Three","Four"];

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const FAST = location.search.includes("fast");               // test mode: shrinks waits
const sleep = ms => new Promise(r => setTimeout(r, FAST ? ms/20 : ms));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pickOne = a => a[Math.floor(Math.random()*a.length)];
const store = { get(){ try{return JSON.parse(localStorage.getItem("sortedKids")||"[]")}catch{return []} },
                set(v){ try{localStorage.setItem("sortedKids",JSON.stringify(v))}catch{} } };
const setStatus = t => $("status").textContent = t || "";
const cap = t => { $("cap").textContent = t; };
let micOn = false, qCount = 6;

/* ================= AUDIO ================= */
let muted = false, actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch{} } return actx; }
function tone(freq, dur=.4, type="sine", vol=.08, delay=0){
  const c = ac(); if(!c || muted) return;
  const t = c.currentTime+delay, o = c.createOscillator(), g = c.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.04); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const magic  = () => [523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,"triangle",.07,i*.09));
const murmur = () => [220,247,262,247].forEach((f,i)=>tone(f,.7,"sine",.05,i*.35));
const fanfare= () => [392,392,523,659,784].forEach((f,i)=>tone(f,.6,"square",.05,i*.18));
const ding   = () => { tone(880,.15,"sine",.12); tone(1175,.25,"sine",.12,.12); };   // "your turn to speak"

/* ================= HAT VOICE ================= */
let voice = null;
const VOICE_RANK = [[/Ryan.*(Online|Natural)/i,100],[/Arthur/i,95],[/Google UK English Male/i,90],[/Oliver/i,88],[/Daniel/i,85],[/George/i,80],[/Thomas/i,70],[/Rishi/i,0]];
function voiceScore(v){
  if(!/^en[-_]GB/i.test(v.lang)) return /^en/i.test(v.lang) ? 5 : -1;
  let sc = 20; for(const [re,p] of VOICE_RANK) if(re.test(v.name)) sc = Math.max(sc,p);
  if(/Natural|Online|Premium|Enhanced/i.test(v.name)) sc += 5; return sc;
}
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const list = speechSynthesis.getVoices().map(v=>({v,sc:voiceScore(v)})).filter(x=>x.sc>=0).sort((a,b)=>b.sc-a.sc);
  if(!list.length) return;
  let saved=null; try{saved=localStorage.getItem("hatVoice")}catch{}
  voice = (saved && list.find(x=>x.v.name===saved)?.v) || list[0].v;
  const sel=$("voiceSel"); sel.innerHTML="";
  list.slice(0,12).forEach(x=>{ const o=document.createElement("option"); o.value=x.v.name; o.textContent=`${x.v.name} (${x.v.lang})${x.sc>=80?" ★":""}`; o.selected=x.v===voice; sel.appendChild(o); });
  $("voiceNote").textContent = list[0].sc>=80 ? "★ = best British Hat voices on this phone." : "No premium British voice found. Android: Settings > Text-to-speech. iPhone: Accessibility > Spoken Content > Voices > English (UK) > Daniel / Arthur.";
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
const STYLE = { normal:{rate:.95,pitch:.65}, whisper:{rate:.82,pitch:.45}, excited:{rate:1.05,pitch:.8}, slow:{rate:.75,pitch:.6} };
const ttsOK = () => !muted && "speechSynthesis" in window && speechSynthesis.getVoices().length > 0;

// Speak chunks back-to-back so it flows like one thought. chunks: [{t, s}]
function sayChain(chunks){
  chunks = chunks.filter(Boolean);
  if(!ttsOK()){
    return chunks.reduce((p,c)=>p.then(async()=>{ cap(c.t); await sleep(Math.min(4500,600+c.t.length*45)); }), Promise.resolve());
  }
  speechSynthesis.cancel();
  return new Promise(res=>{
    const total = chunks.reduce((n,c)=>n+c.t.length,0);
    const guard = setTimeout(res, total*130+8000);
    chunks.forEach((c,i)=>{
      const u = new SpeechSynthesisUtterance(c.t);
      if(voice) u.voice = voice;
      const st = STYLE[c.s||"normal"]; u.rate=st.rate; u.pitch=st.pitch;
      u.onstart = () => cap(c.t);
      if(i===chunks.length-1) u.onend = u.onerror = () => { clearTimeout(guard); res(); };
      speechSynthesis.speak(u);
    });
  });
}
const say = (t, s) => sayChain([{t, s}]);

/* ================= EARS (optional) ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, tapResolve = null;
const NUMW = [["one","1","won","first"],["two","2","to","too","second"],["three","3","free","tree","third"],["four","4","for","fore","fourth"]];
const HOMO = new Set(["won","to","too","free","tree","for","fore"]);
const norm = h => h.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
function parseNum(h,n){
  h = norm(h); const short = h.split(" ").length <= 3;
  for(let i=0;i<n;i++) for(const w of NUMW[i]){
    if(HOMO.has(w) && !short) continue;
    if(new RegExp("\\b"+w+"\\b").test(h)) return i;
  }
  return -1;
}
const parseOpt = opts => h => {
  if(/\b(repeat|again|what|pardon|sorry)\b/.test(norm(h))) return "repeat";
  const n = parseNum(h,4); if(n!==-1) return n;
  const hn = norm(h); let best=-1, bestN=0, tie=false;
  opts.forEach((o,i)=>{ const n=o[1].toLowerCase().split(/\W+/).filter(w=>w.length>4).filter(w=>hn.includes(w)).length;
    if(n>bestN){best=i;bestN=n;tie=false} else if(n===bestN&&n>0) tie=true; });
  return bestN>0 && !tie ? best : -1;
};
const parseYesNo = h => { const n = norm(h);
  if(/\b(another|again|change|different|no|nope|new|reroll)\b/.test(n)) return 1;
  if(/\b(yes|yeah|yep|sure|ok|okay|fine|good|love|keep)\b/.test(n)) return 0;
  return parseNum(h,2); };
const parseHouse = (k1,k2) => h => { const n = norm(h);
  if(HOUSE_RE[k1].test(n)) return 0; if(HOUSE_RE[k2].test(n)) return 1; return parseNum(h,2); };

function listenParse(parse){
  if(!micOn || !SR) return new Promise(()=>{});               // keypad-only: wait for a tap
  return new Promise(res=>{
    let done=false, hard=false;
    const fin = v => { if(!done){ done=true; clearTimeout(t); res(v); } };
    const t = setTimeout(()=>{ try{rec.stop()}catch{} fin(null); }, 10000);
    try{
      rec = new SR(); rec.lang="en-GB"; rec.interimResults=false; rec.maxAlternatives=3;
      rec.onresult = e => { const alts=[...e.results[0]].map(r=>r.transcript); setStatus("heard: "+alts[0]);
        for(const a of alts){ const p=parse(a); if(p!==-1) return fin(p); } fin(null); };
      rec.onerror = e => {
        if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)){
          hard=true; micOn=false; $("micChk").checked=false; clearTimeout(t);
          setStatus("Mic unavailable. Use the keypad"); }
        else fin(null); };
      rec.onend = () => { if(!hard) fin(null); };
      ding(); rec.start();
    }catch{ micOn=false; setStatus("Mic unavailable. Use the keypad"); clearTimeout(t); }
  });
}

/* ================= NOISE GATE ================= */
let noiseOn = true, noiseLimit = -34, lastLevel = null, noiseRun = 0;
try{ const v=+localStorage.getItem("noiseLimit"); if(v) noiseLimit=v; }catch{}
const NOISY = ["Whoa, whoa, whoa! Far too noisy. I cannot hear a thing over this racket. Quiet please, wizards, and I shall wait.",
               "Goodness me! My brim is ringing. It is far too noisy for me to hear. A little hush, please."];
const NAGS  = ["Still too noisy. I am a hat, not a trumpet.","I am waiting… my brim is very patient.","Shhhhh! Hat needs to listen.","Nothing yet. Quieter, please."];
// Average loudness (dBFS, 75th percentile of ~60ms frames) over ms. null = unavailable, {err} = mic blocked
async function measureLevel(ms=1100){
  const c = ac(); if(!c || !navigator.mediaDevices) return null;
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }
  catch{ return {err:true}; }
  try{
    await c.resume();
    const src=c.createMediaStreamSource(stream), an=c.createAnalyser(); an.fftSize=1024; src.connect(an);
    const buf=new Float32Array(an.fftSize), vals=[], end=performance.now()+ms;
    while(performance.now()<end){
      await new Promise(r=>setTimeout(r,60)); an.getFloatTimeDomainData(buf);
      let sum=0; for(const x of buf) sum+=x*x; vals.push(20*Math.log10(Math.sqrt(sum/buf.length)||1e-6));
    }
    src.disconnect(); vals.sort((a,b)=>a-b);
    return vals.length ? vals[Math.floor(vals.length*.75)] : null;
  } finally { stream.getTracks().forEach(t=>t.stop()); }               // free the mic before speech recognition starts
}
function micBlocked(){ micOn=false; $("micChk").checked=false; setStatus("Mic unavailable. Use the keypad"); }
// Resolves "ok" (quiet enough), "waited" (was noisy, now quiet), or "nomic". Abandoned if noiseRun changes (host tapped).
async function ensureQuiet(){
  if(!noiseOn || !micOn || !SR) return "ok";
  const my = ++noiseRun;
  let lvl = await measureLevel(1100);
  if(my!==noiseRun) return "ok";
  if(lvl && lvl.err){ micBlocked(); return "nomic"; }
  lastLevel = lvl; if(lvl!=null) setStatus(`room ${Math.round(lvl)} dB (limit ${noiseLimit})`);
  if(lvl==null || lvl<=noiseLimit) return "ok";
  await say(pickOne(NOISY),"excited");
  const t0=Date.now(); let quietSince=null, lastNag=Date.now();
  while(my===noiseRun){
    await sleep(600);
    lvl = await measureLevel(900);
    if(my!==noiseRun) return "ok";
    if(lvl && lvl.err){ micBlocked(); return "nomic"; }
    if(lvl!=null) setStatus(`room ${Math.round(lvl)} dB (limit ${noiseLimit})`);
    if(lvl==null || lvl<=noiseLimit){ quietSince = quietSince || Date.now(); if(Date.now()-quietSince>1500) break; }
    else quietSince=null;
    if(Date.now()-lastNag>14000){ await say(pickOne(NAGS),"whisper"); lastNag=Date.now(); }
    if(Date.now()-t0>45000) break;                                        // do not wait forever
  }
  if(my!==noiseRun) return "ok";
  await say("Ah. Much better.","whisper"); return "waited";
}
const tapWait = () => new Promise(r => { tapResolve = r; });
function showKeypad(n){
  const k=$("keypad"); k.innerHTML="";
  for(let i=0;i<n;i++){ const b=document.createElement("button"); b.textContent=i+1; b.setAttribute("aria-label","Answer "+(i+1));
    b.onclick=()=>{ if(tapResolve){ const r=tapResolve; tapResolve=null; r(i); } }; k.appendChild(b); }
  k.style.display="flex";
}
const hideKeypad = () => { $("keypad").style.display="none"; };
async function getAnswer(n, parse, reprompts){
  showKeypad(n);
  for(let t=0;t<=reprompts.length;t++){
    // 1. make sure the room is quiet enough to hear (a host tap overrides)
    const pre = await Promise.race([ensureQuiet(), tapWait()]);
    if(typeof pre==="number"){ noiseRun++; try{speechSynthesis.cancel()}catch{} tapResolve=null; hideKeypad(); return pre; }
    if(pre==="waited") await say(reprompts[0]);                         // cue again after the hush
    // 2. listen
    const r = await Promise.race([listenParse(parse), tapWait()]);
    try{ rec && rec.abort(); }catch{}
    tapResolve = null;
    if(r!==null){ hideKeypad(); return r; }
    if(t<reprompts.length){
      const loud = lastLevel!=null && lastLevel > noiseLimit-6;
      await say(loud ? "I am struggling to hear you over the noise. Come closer, and speak up. " + reprompts[0] : reprompts[t]);
    }
  }
  hideKeypad(); return null;
}

/* ================= THE SHOW ================= */
let name="", answers=[], scores={}, chosen=false, house=null, first=true, busy=false;
const fill = t => t.replace(/\{n\}/g, name);

async function runChild(){
  if(busy) return; busy=true; $("big").style.display="none"; $("menu").open=false;
  name = roll(); answers=[]; scores={G:0,H:0,R:0,S:0}; chosen=false;
  magic();

  // 1. alias, with optional re-roll
  for(let t=0;t<3;t++){
    await sayChain([{t:t===0?"Ahhh. A new head to peer into. Hmmm… I shall call you…":"Then how about…",s:"slow"},{t:name+"!",s:"excited"},
                    {t:"Say yes to keep it, or say another for a new name."}]);
    const r = await getAnswer(2, parseYesNo, ["Yes, or another?"]);
    if(r===1 && t<2){ name = roll(); continue; }
    break;
  }
  await say(`${name}. Splendid. Now answer honestly, for I can smell a fib.`, "whisper");
  if(first){ await say("After the ding, say the number of your answer. One, two, three or four. Say repeat if you want to hear it again."); first=false; }

  // 2. questions
  const order = shuffle(QS).slice(0,qCount);
  for(let qi=0; qi<order.length; qi++){
    const Q = order[qi], opts = shuffle(Q.o);
    let idx = null;
    while(true){
      setStatus(`Question ${qi+1} of ${order.length}`);
      await sayChain([{t:Q.q}, ...opts.map((o,i)=>({t:`${NUMS[i]}. ${o[1]}`}))]);
      const r = await getAnswer(4, parseOpt(opts), ["Hm? I did not catch that. One, two, three or four?","Speak up, young wizard! One, two, three or four?"]);
      if(r==="repeat") continue; idx=r; break;
    }
    if(idx===null){ idx=Math.floor(Math.random()*4); await say("Cat got your tongue? Never mind, I shall choose for you.","whisper"); }
    const o = opts[idx]; scores[o[0]]++; answers.push(o);
    if(qi<order.length-1) await say(pickOne(ACKS),"whisper");
  }

  // 3. tie-break
  setStatus("");
  const ranked = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  let k = ranked[0][0];
  if(ranked[0][1]-ranked[1][1] <= 1){
    const k1=ranked[0][0], k2=ranked[1][0];
    await sayChain([{t:`Hmmm. Difficult. Very difficult, ${name}.`,s:"slow"},{t:`You could go to ${H[k1].name}… or ${H[k2].name}.`},{t:"Where do you want to go? Say the house."}]);
    const r = await getAnswer(2, parseHouse(k1,k2), ["Which one? Say the house name."]);
    k = r===1 ? k2 : k1; chosen = r!==null;
  }
  await ceremony(k);
  busy=false; setStatus("");
  $("big").textContent="Next child"; $("big").style.display="";
}

async function ceremony(k){
  house=k; murmur();
  const ranked = Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const second = ranked.find(x=>x!==k), lowest = ranked[3]===k ? ranked[2] : ranked[3];
  const mine = shuffle(answers.filter(a=>a[0]===k));
  const rival = shuffle(answers.filter(a=>a[0]===second));
  const odd = shuffle(answers.filter(a=>a[0]!==k && a[0]!==second));
  const C=[]; const add=(t,s)=>t&&C.push({t:fill(t),s:s||"normal"});

  add(pickOne([`Hmmmm… ${name}. Well, well, well. Let me just have a poke around in there…`,`Ooh. Ooh, ${name}. Hold still. Let me rummage about in that head of yours…`]),"slow");
  if(mine[0]){ add(pickOne(["Now THIS is interesting.","Ooh, I like this bit."])); add(mine[0][2]); }
  if(rival[0]||odd[0]){ const r=rival[0]||odd[0];
    add(pickOne(["But hold on, hold on…","Hmm, but then…"]),"whisper"); add(r[2]);
    add(`That's a bit ${H[r[0]].name}, isn't it? Hmm. Oh dear. Now I'm doubting myself.`,"whisper"); }
  if(mine[1]){ add(pickOne(["And yet…","Then again…"])); add(mine[1][2]); add("Oh, that pulls me back. But no, no, not yet."); }
  if(odd[0]&&rival[0]) add(odd[0][2]);
  add(`Let me count. ${scores[k]} for ${H[k].name}… ${scores[second]} for ${H[second].name}… my brim hurts from the maths.`,"whisper");
  add(scores[lowest]===0 ? `And not one drop of ${H[lowest].name} in you. I checked behind the ears.` : `As for ${H[lowest].name}, hardly a whisper. I'd be amazed.`,"whisper");
  if(chosen) add(`And you asked for ${H[k].name} yourself. Who am I to argue with a wizard who knows their own mind?`);
  add(pickOne(["Hm hm hm. Yes. No. Yes… Oh! I know exactly where to put you.","Right. Right, right, right. I've got it. I've definitely got it."]),"slow");
  add("Better be…","slow"); add(H[k].name.toUpperCase()+"!","excited");
  await sayChain(C);
  fanfare(); await sleep(900);
  const h=H[k]; save(k);
  await sayChain([{t:`${name}, you are ${h.traits.join(", ")}. Remember your name, and wear it proudly.`},{t:h.dare,s:"excited"},{t:"Next wizard, step forward!",s:"slow"}]);
}
function save(k){ const all=store.get(); all.push({name,house:k,chosen,ts:Date.now()}); store.set(all); }

/* ================= WIRING ================= */
async function unlock(){
  ac() && ac().resume(); tone(1,.01,"sine",0.0001);
  try{ if("speechSynthesis" in window){ const u=new SpeechSynthesisUtterance(" "); speechSynthesis.speak(u); } }catch{}
  try{ if("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch{}
}
document.addEventListener("visibilitychange", async()=>{ if(document.visibilityState==="visible"){ try{ if("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch{} } });
$("big").onclick = async () => { await unlock(); runChild(); };
$("micChk").onchange = e => { micOn = e.target.checked && !!SR; if(e.target.checked && !SR){ e.target.checked=false; setStatus("This browser can't listen. Use the keypad."); } };
$("capChk").onchange = e => document.body.classList.toggle("caps", e.target.checked);
$("lenSel").onchange = e => qCount = +e.target.value;
$("voiceSel").onchange = e => { voice = speechSynthesis.getVoices().find(v=>v.name===e.target.value) || voice; try{localStorage.setItem("hatVoice",voice.name)}catch{} };
$("voiceTest").onclick = async () => { await unlock(); say("Hmmmm. Difficult. Very difficult. I see plenty of courage, and not a bad mind either."); };
$("scoreBtn").onclick = async () => { await unlock(); const all=store.get(); const t=k=>all.filter(a=>a.house===k).length;
  sayChain([{t:"House points, as they stand."},...Object.keys(H).map(k=>({t:`${H[k].name}: ${t(k)}.`})),{t:all.length?"Carry on, wizards.":"Nobody has been sorted yet."}]); };
$("clearBtn").onclick = () => { if(confirm("Delete all saved results on this phone?")) store.set([]); };
$("stopBtn").onclick = () => { try{speechSynthesis.cancel()}catch{} location.reload(); };
$("noiseChk").onchange = e => noiseOn = e.target.checked;
const showLimit = () => { $("noiseVal").textContent = ` ${noiseLimit} dB`; $("noiseRange").value = noiseLimit; };
$("noiseRange").oninput = e => { noiseLimit = +e.target.value; try{localStorage.setItem("noiseLimit",noiseLimit)}catch{}; showLimit(); };
$("noiseTest").onclick = async () => { await unlock(); $("noiseOut").textContent="Listening to the room…";
  const l = await measureLevel(2500);
  $("noiseOut").textContent = !l && l!==0 ? "Could not read the mic." : l.err ? "Mic blocked. Allow microphone access." :
    `Room: ${Math.round(l)} dB. ${l>noiseLimit?"TOO NOISY for the Hat.":"Quiet enough."}`; };
$("noiseSet").onclick = async () => { await unlock(); $("noiseOut").textContent="Hold the room at the loudest you'd accept…";
  const l = await measureLevel(3000);
  if(l && !l.err){ noiseLimit = Math.max(-55,Math.min(-12,Math.round(l+6))); try{localStorage.setItem("noiseLimit",noiseLimit)}catch{}; showLimit();
    $("noiseOut").textContent=`Limit set to ${noiseLimit} dB.`; } else $("noiseOut").textContent="Could not read the mic."; };
showLimit();
micOn = !!SR; $("micChk").checked = micOn;
if(!SR) setStatus("No mic support here. Use the keypad.");
</script>
