<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sorting Hat</title>
<style>
:root{color-scheme:dark;--ink:#8b84a3;--dim:#3a3548;--gold:#a8832f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:Georgia,serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:calc(env(safe-area-inset-top,0px) + 44px) calc(env(safe-area-inset-bottom,0px) + 150px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit}
#big{background:transparent;color:var(--gold);border:2px solid var(--dim);border-radius:24px;width:min(80vw,340px);padding:38px 12px;font-size:1.5rem}

#host{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);display:none;justify-content:center;align-items:center;gap:14px}

#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:none;justify-content:center;gap:12px}
#bar button{background:transparent;color:var(--ink);border:2px solid var(--dim);border-radius:99px;padding:14px 18px;font-size:1.05rem}
#bar button.on{border-color:var(--gold);color:var(--gold)}
#museBtn,#revealBtn{display:none}
#bar{flex-wrap:wrap;gap:8px}

#picker{display:none;text-align:center;width:min(94vw,420px)}
#picker h2{font-size:1.15rem;font-weight:normal;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

.gwrap{max-width:460px;margin:0 auto}

.grow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.grow button,.gitem button{background:transparent;color:var(--ink);border:1px solid var(--dim);border-radius:10px;padding:10px 14px}

#sheetBox textarea,#sheetBox input{display:block;width:100%;background:#000;color:var(--ink);border:1px solid var(--dim);border-radius:10px;padding:10px;font-size:16px;margin-top:6px}
.gnote{font-size:.85rem;color:var(--ink);margin:8px 0 0}
#sheetMsg{min-height:1.2em;font-size:.85rem;color:var(--ink)}
#gMsg{min-height:1.2em;font-size:.85rem;color:var(--ink)}
#gList{list-style:none;margin:10px 0;padding:0}

<body>
<div id="guestView" role="dialog" aria-label="Guest answers"><div class="gwrap">
  <h2>Guest answers</h2>
  <form id="gForm" autocomplete="off">
    <label>Name<input id="gN" maxlength="20" required></label>
    <label>Favourite food<input id="gF" maxlength="30"></label>
    <label>Favourite animal<input id="gA" maxlength="30"></label>
    <label>Really good at<input id="gG" maxlength="40"></label>
    <label>Magic power they'd pick<input id="gP" maxlength="40"></label>
    <label>Mysterious door<select id="gC0"><option value="-">(skip)</option><option value="G">Flings it open</option><option value="H">Grabs a friend first</option><option value="R">Reads the clues</option><option value="S">Finds a shortcut</option></select></label>
    <label>Someone left out<select id="gC1"><option value="-">(skip)</option><option value="G">Invites them in, loudly</option><option value="H">Sits with them</option><option value="R">Works out why and helps</option><option value="S">Quietly fixes it</option></select></label>
    <label>Friends should say<select id="gC2"><option value="-">(skip)</option><option value="G">So brave</option><option value="H">So kind</option><option value="R">So clever</option><option value="S">Never gives up</option></select></label>
    <div class="grow"><button type="submit" id="gSave">Add guest</button><button type="button" id="gReset">Clear form</button><button type="button" id="gClose">Done</button></div>
    <div id="gMsg"></div>
  </form>
  <details id="sheetBox"><summary>Import from a Google Form sheet</summary>
    <p class="gnote">In the response sheet: select all, copy, paste below. Or paste the sheet's "Publish to web" CSV link and tap Fetch.</p>
    <textarea id="sheetPaste" rows="5" placeholder="Paste the copied sheet here (with the header row)"></textarea>
    <div class="grow"><button type="button" id="sheetImport">Import pasted sheet</button></div>
    <input id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv" inputmode="url">
    <div class="grow"><button type="button" id="sheetFetch">Fetch from link</button></div>
    <div id="sheetMsg"></div>
  </details>
  <ul id="gList"></ul>
</div></div>
<div id="status"></div>
<details id="menu"><summary aria-label="Settings">⚙</summary>
  <div class="panel">
    <label><input type="checkbox" id="micChk"> Listen for spoken names</label>
    <label><input type="checkbox" id="capChk"> Show captions</label>
    <label>Hat voice <select id="voiceSel"></select></label>
    <div><button id="voiceTest">Test voice</button><button id="scoreBtn">Speak scores</button></div>
    <div><button id="openGuests">Guests (<span id="gCount">0</span>)…</button></div>
    <div><button id="clearBtn">Clear table</button><button id="stopBtn">Stop / reset</button></div>
    <div id="voiceNote" style="font-size:.8rem;color:var(--dim)"></div>
  </div>
</details>

<div id="picker"><h2 id="pickTitle"></h2><div class="grid" id="pickGrid"></div><div id="guestRow"><span>Survey:</span><select id="guestSel" aria-label="Survey answers to use"></select></div></div>
<div id="table"><div class="grid" id="tableGrid"></div></div>
<button id="big">Wake the Hat</button>
<div id="cap"></div>
<div id="host"><input id="hostName" type="text" placeholder="type name, Enter" aria-label="Type the child's name"></div>
<div id="bar"><button id="noiseBtn">🔇 Too noisy</button><button id="museBtn">💭 Keep musing</button><button id="revealBtn">⏭ Reveal now</button></div>

<script>
"use strict";
/* ================= DATA ================= */
const H = {
  G:{name:"Gryffindor",color:"#7a2a2a",traits:["brave","daring","a little bit loud"],
     dare:"House dare: give your very best lion ROAR!",
     hints:["I sense a streak of daring. Do you leap before you look, {n}? Don't answer, I can see it from here.",
            "Something fiery in here. Sparks! Tell me you haven't been jumping off the furniture.",
            "There's a roar brewing in this one. I'm sure of it."]},
  H:{name:"Hufflepuff",color:"#8a7420",traits:["kind","loyal","a sharer of snacks"],
     dare:"House dare: give someone in the room a proper compliment. Right now!",
     hints:["There's a warm glow in here. Somebody shares their snacks, don't they?",
            "I detect an enormous heart. Kindness, loyalty, and probably a few crumbs.",
            "Oh, you're the one who notices when someone is left out, aren't you, {n}?"]},
  R:{name:"Ravenclaw",color:"#2a4a8a",traits:["clever","curious","full of strange facts"],
     dare:"House dare: make up a riddle and stump the room!",
     hints:["So many questions rattling around in here! Why this, why that, why do hats talk?",
            "A very curious mind. Always asking but why. I love it, {n}.",
            "Clever little thoughts whizzing about like pixies."]},
  S:{name:"Slytherin",color:"#2a6a44",traits:["cunning","ambitious","excellent at plans"],
     dare:"House dare: invent a secret handshake for your house. Recruit a partner!",
     hints:["I sense a cunning plan. You've already worked out where the cake is, haven't you?",
            "Ooh, ambition! Something big is being planned in here. Do share the credit.",
            "Sneaky, resourceful, and rather good at getting your own way, I'd wager."]}
};
const NEUTRAL = [
  "Plenty of room up here, {n}. Ideas rattling about like marbles in a tin.",
  "I have sorted witches, wizards, and one very confused goat. You are far more promising than the goat.",
  "Hold still, {n}. Your hair is tickling my brim.",
  "Hmm. Brain, present. Heart, present. Snacks… I can smell cake.",
  "Stop wiggling! A hat must be worn with dignity.",
  "Ooh, a ticklish thought just went by. Gone. Never mind.",
  "Oh, you've got something in there. A big dream, perhaps? Don't tell me, I like to guess."
];

const TANGENTS = [
  "You know, I was a very ambitious sock before I became a hat. Long story. Don't ask about the toe.",
  "A thousand years I have sat on that shelf. A thousand years! Nobody ever asks how I am.",
  "I once sorted a wizard who tried to bribe me with a chocolate frog. It worked. Don't tell anyone.",
  "Mind you, the last head I wore smelled of pickled onions. Yours is much better.",
  "I do enjoy thinking. It's most of what hats do, really. That and getting hair in the seams.",
  "I get terribly dizzy when I'm indecisive. Give me a moment. It's all going round and round.",
  "Between you and me, Gryffindors are loud, Ravenclaws are smug, and Hufflepuffs always have biscuits.",
  "Ooh, hold on. I think I have a thought stuck in my brim."
];
const DOUBTS = [
  "No, wait. Wait, wait, wait. That's not right either.",
  "Hmm. Is it that? Or is it just indigestion? It's very hard to tell with a hat.",
  "Oh, this is a tricky one. Very tricky. My brim is sweating.",
  "I thought I had decided, but now I'm not sure at all. Give me a minute.",
  "Let me look at that from another angle. Tilt your head. Not that much!"
];
const CQ = [   // the Hat's comment on each survey choice question, by house letter
  {G:"you flung that mysterious door open without a second thought. My brim is trembling.",
   H:"you would bring a friend to the spooky door. Smart. Sweet. Probably smells of biscuits.",
   R:"you would study the door before touching it. I love a nerd. Said with deep affection.",
   S:"you would hunt for a sneaky shortcut around that door. Rules are more like suggestions, hmm?"},
  {G:"when someone is left out, you march over and invite them in, loudly. Subtle as a troll, kind as a unicorn.",
   H:"when someone is left out, you sit with them. That's the best kind of magic, and it's free.",
   R:"when someone is left out, you work out how to help. A thinker AND a helper. Rare.",
   S:"when someone is left out, you quietly fix it behind the scenes. A hero in the shadows. Very you."},
  {G:"you would love to be called brave. Funny, so did I, until I became a hat.",
   H:"you want to be known as kind. That's the strongest magic of all.",
   R:"you want to be called clever. Well. I'm a hat. I have opinions on that.",
   S:"you want to be known for never giving up. I can feel the determination from here."}
];
const LEADS = ["A little bird told me that ","Your survey whispered to me that ","I have it on good authority that "];
const NOISY  = ["Oh dear. I can't hear very well with all this noise. I shall wait until it is quieter.",
                "Goodness me, my brim is ringing. I can't hear a thing. I'll wait for a little hush."];
const RESUME = ["Ah, that's better. Now, where was I?","Mmm, much better. Where were we?"];
/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const FAST = location.search.includes("fast");               // test mode: shrinks waits
const sleep = ms => new Promise(r => setTimeout(r, FAST ? ms/20 : ms));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pickOne = a => a[Math.floor(Math.random()*a.length)];
const setStatus = t => $("status").textContent = t || "";
const cap = t => { $("cap").textContent = t; };
let micOn = false;

/* ================= AUDIO ================= */
let muted = false, actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch{} } return actx; }
function tone(freq, dur=.4, type="sine", vol=.08, delay=0){
  const c = ac(); if(!c || muted) return;
  const t = c.currentTime+delay, o = c.createOscillator(), g = c.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.04); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const magic  = () => [523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,"triangle",.07,i*.09));
const murmur = () => [220,247,262,247].forEach((f,i)=>tone(f,.7,"sine",.05,i*.35));
const fanfare= () => [392,392,523,659,784].forEach((f,i)=>tone(f,.6,"square",.05,i*.18));
const ding   = () => { tone(880,.15,"sine",.12); tone(1175,.25,"sine",.12,.12); };   // "your turn to speak"

/* ================= HAT VOICE ================= */
let voice = null;
const VOICE_RANK = [[/Ryan.*(Online|Natural)/i,100],[/Arthur/i,95],[/Google UK English Male/i,90],[/Oliver/i,88],[/Daniel/i,85],[/George/i,80],[/Thomas/i,70],[/Rishi/i,0]];
function voiceScore(v){
  if(!/^en[-_]GB/i.test(v.lang)) return /^en/i.test(v.lang) ? 5 : -1;
  let sc = 20; for(const [re,p] of VOICE_RANK) if(re.test(v.name)) sc = Math.max(sc,p);
  if(/Natural|Online|Premium|Enhanced/i.test(v.name)) sc += 5; return sc;
}
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const list = speechSynthesis.getVoices().map(v=>({v,sc:voiceScore(v)})).filter(x=>x.sc>=0).sort((a,b)=>b.sc-a.sc);
  if(!list.length) return;
  let saved=null; try{saved=localStorage.getItem("hatVoice")}catch{}
  voice = (saved && list.find(x=>x.v.name===saved)?.v) || list[0].v;
  const sel=$("voiceSel"); sel.innerHTML="";
  list.slice(0,12).forEach(x=>{ const o=document.createElement("option"); o.value=x.v.name; o.textContent=`${x.v.name} (${x.v.lang})${x.sc>=80?" ★":""}`; o.selected=x.v===voice; sel.appendChild(o); });
  $("voiceNote").textContent = list[0].sc>=80 ? "★ = best British Hat voices on this phone." : "No premium British voice found. Android: Settings > Text-to-speech. iPhone: Accessibility > Spoken Content > Voices > English (UK) > Daniel / Arthur.";
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }

const STYLE = { normal:{rate:.95,pitch:.65}, whisper:{rate:.82,pitch:.45}, excited:{rate:1.05,pitch:.8}, slow:{rate:.75,pitch:.6} };
const ttsOK = () => !muted && "speechSynthesis" in window && speechSynthesis.getVoices().length > 0;
const mkUtt = c => { const u=new SpeechSynthesisUtterance(c.t); if(voice) u.voice=voice;
  const st=STYLE[c.s||"normal"]; u.rate=st.rate; u.pitch=st.pitch; return u; };

/* ---- pause ("too noisy") ---- */
let skipSay=false, paused=false, pauseCount=0, resumeWaiters=[], abortSpeech=()=>{};
const waitResume = () => paused ? new Promise(r=>resumeWaiters.push(r)) : Promise.resolve();
function speakNow(t, s){                                  // raw speech that ignores the pause flag
  cap(t);
  if(!ttsOK()) return sleep(Math.min(4500,600+t.length*45));
  speechSynthesis.cancel();
  return new Promise(res=>{ const u=mkUtt({t,s}); const g=setTimeout(res,12000); u.onend=u.onerror=()=>{clearTimeout(g);res();}; speechSynthesis.speak(u); });
}
// Queue chunks back-to-back so it flows. If paused mid-way, resume re-speaks from the interrupted chunk.
function speakQueue(chunks){
  return new Promise(res=>{
    let done=0, fin=false;
    const finish = n => { if(!fin){ fin=true; clearTimeout(guard); abortSpeech=()=>{}; res(n); } };
    const total = chunks.reduce((n,c)=>n+c.t.length,0);
    const guard = setTimeout(()=>finish(chunks.length), total*130+8000);   // TTS silently dead: move on
    abortSpeech = () => finish(done);
    speechSynthesis.cancel();
    chunks.forEach(c=>{
      const u=mkUtt(c);
      u.onstart=()=>cap(c.t);
      u.onend=()=>{ done++; if(done===chunks.length) finish(done); };
      u.onerror=()=>{ if(paused) finish(done); else { done++; if(done===chunks.length) finish(done); } };
      speechSynthesis.speak(u);
    });
  });
}
async function sayChain(chunks){
  chunks = chunks.filter(Boolean);
  let i=0;
  while(i<chunks.length){
    if(skipSay) return;
    await waitResume();
    if(skipSay) return;
    if(!ttsOK()){ cap(chunks[i].t); await sleep(Math.min(4500,600+chunks[i].t.length*45)); i++; continue; }
    i += await speakQueue(chunks.slice(i));
  }
}
const say = (t,s) => sayChain([{t,s}]);
async function togglePause(){
  if(!paused){
    paused=true; pauseCount++; $("noiseBtn").textContent="▶ Quiet now"; $("noiseBtn").classList.add("on");
    abortSpeech(); try{ speechSynthesis.cancel(); }catch{}; try{ rec && rec.abort(); }catch{}
    await speakNow(pickOne(NOISY));
  } else {
    await speakNow(pickOne(RESUME));
    paused=false; $("noiseBtn").textContent="🔇 Too noisy"; $("noiseBtn").classList.remove("on");
    resumeWaiters.splice(0).forEach(r=>r());
  }
}
/* ================= EARS (optional) ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, tapResolve = null;
const NUMW = [["one","1","won","first"],["two","2","to","too","second"],["three","3","free","tree","third"],["four","4","for","fore","fourth"]];
const HOMO = new Set(["won","to","too","free","tree","for","fore"]);
const norm = h => h.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
function parseNum(h,n){
  h = norm(h); const short = h.split(" ").length <= 3;
  for(let i=0;i<n;i++) for(const w of NUMW[i]){
    if(HOMO.has(w) && !short) continue;
    if(new RegExp("\\b"+w+"\\b").test(h)) return i;
  }
  return -1;
}
const parseOpt = opts => h => {
  if(/\b(repeat|again|what|pardon|sorry)\b/.test(norm(h))) return "repeat";
  const n = parseNum(h,4); if(n!==-1) return n;
  const hn = norm(h); let best=-1, bestN=0, tie=false;
  opts.forEach((o,i)=>{ const n=o[1].toLowerCase().split(/\W+/).filter(w=>w.length>4).filter(w=>hn.includes(w)).length;
    if(n>bestN){best=i;bestN=n;tie=false} else if(n===bestN&&n>0) tie=true; });
  return bestN>0 && !tie ? best : -1;
};
const parseYesNo = h => { const n = norm(h);
  if(/\b(another|again|change|different|no|nope|new|reroll)\b/.test(n)) return 1;
  if(/\b(yes|yeah|yep|sure|ok|okay|fine|good|love|keep)\b/.test(n)) return 0;
  return parseNum(h,2); };
const parseHouse = (k1,k2) => h => { const n = norm(h);
  if(HOUSE_RE[k1].test(n)) return 0; if(HOUSE_RE[k2].test(n)) return 1; return parseNum(h,2); };


// ---- name parsing ----
function cleanName(h){
  let n = h.replace(/[^\p{L}\s'-]/gu," ").trim();
  for(let i=0;i<2;i++) n = n.replace(/^(hi|hello|hey|um|uh|er|my name is|my names|name is|i am|i'm|im|it's|its|this is|call me|they call me)\s+/i,"");
  const w = n.split(/\s+/).filter(Boolean).slice(0,3); if(!w.length || /^(yes|no|yeah|yep|yup|nope)$/i.test(w.join(" "))) return null;
  return w.map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join(" ");
}
const parseName = h => { const n = cleanName(h); return n ? {name:n} : -1; };
const parseConfirm = h => { const n = norm(h);
  if(/\b(yes|yeah|yep|yup|correct|right|that's me|thats me)\b/.test(n)) return 0;
  if(/\b(no|nope|wrong|not)\b/.test(n)) return 1;
  return parseName(h); };

function listenParse(parse){
  if(!micOn || !SR) return new Promise(()=>{});               // keypad-only: wait for a tap
  return new Promise(res=>{
    let done=false, hard=false;
    const fin = v => { if(!done){ done=true; clearTimeout(t); res(v); } };
    const t = setTimeout(()=>{ try{rec.stop()}catch{} fin(null); }, 10000);
    try{
      rec = new SR(); rec.lang="en-GB"; rec.interimResults=false; rec.maxAlternatives=3;
      rec.onresult = e => { const alts=[...e.results[0]].map(r=>r.transcript); setStatus("heard: "+alts[0]);
        for(const a of alts){ const p=parse(a); if(p!==-1) return fin(p); } fin(null); };
      rec.onerror = e => {
        if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)){
          hard=true; micOn=false; $("micChk").checked=false; clearTimeout(t);
          setStatus("Mic unavailable. Use the keypad"); }
        else fin(null); };
      rec.onend = () => { if(!hard) fin(null); };
      ding(); rec.start();
    }catch{ micOn=false; setStatus("Mic unavailable. Use the keypad"); clearTimeout(t); }
  });
}


const tapWait = () => new Promise(r => { tapResolve = r; });
const hostEl=$("host"), hostIn=$("hostName");
function showHost(n, withName){

  for(let i=0;i<n;i++){ const b=document.createElement("button"); b.textContent=i+1; b.setAttribute("aria-label","Answer "+(i+1));
    b.onclick=()=>{ if(tapResolve){ const r=tapResolve; tapResolve=null; r(i); } }; hostEl.insertBefore(b,hostIn); }
  hostIn.style.display = withName ? "block" : "none";
  hostEl.style.display = (n||withName) ? "flex" : "none";
}
const hideHost = () => { hostEl.style.display="none"; hostIn.value=""; };
hostIn.addEventListener("keydown", e => { if(e.key==="Enter"){ const n=cleanName(hostIn.value); hostIn.value="";
  if(n && tapResolve){ const r=tapResolve; tapResolve=null; r({name:n}); } } });

async function getAnswer(n, parse, reprompts, withName=false){
  showHost(n, withName);
  for(let t=0;t<=reprompts.length;t++){
    await waitResume();
    const pc = pauseCount;
    const r = await Promise.race([listenParse(parse), tapWait()]);
    try{ rec && rec.abort(); }catch{}
    tapResolve = null;
    if(r!==null){ hideHost(); return r; }
    if(pc!==pauseCount){ await waitResume(); await say(reprompts[0]); t--; continue; }   // paused: don't burn a retry
    if(t<reprompts.length) await say(reprompts[t]);
  }
  hideHost(); return null;
}

const guests = { get(){ try{return JSON.parse(localStorage.getItem("hatGuests")||"[]")}catch{return []} },
                 set(v){ try{localStorage.setItem("hatGuests",JSON.stringify(v))}catch{} } };
const clip = (s,n) => String(s||"").replace(/[\u0000-\u001f\u007f]/g," ").replace(/\s+/g," ").trim().slice(0,n);
function twoTap(btn, armed, fn){                 // confirm() is blocked in some viewers, so confirm in the button itself
  const orig = btn.textContent; let on=false, t;
  btn.onclick = () => { if(!on){ on=true; btn.textContent=armed; t=setTimeout(()=>{on=false;btn.textContent=orig},3000); }
                        else { clearTimeout(t); on=false; btn.textContent=orig; fn(); } };
}

$("gForm").addEventListener("submit", e => {

  const g={ n, f:clip(gv("gF"),30), a:clip(gv("gA"),30), g:clip(gv("gG"),40), p:clip(gv("gP"),40), c:[0,1,2].map(i=>gv("gC"+i)).join("") };

$("openGuests").onclick = () => { $("menu").open=false; $("guestView").classList.add("open"); $("gN").focus(); };
const lev = (a,b) => { const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i;
  for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; };
const key = s => s.toLowerCase().replace(/[^a-z]/g,"");
function matchGuest(spoken){                                   // index into guests.get(), or -1
  const k=key(spoken.split(" ")[0]||""); if(!k) return -1;
  const all=guests.get(); let best=-1, bd=99;
  all.forEach((g,i)=>{ const gk=key(g.n.split(" ")[0]||""); if(!gk) return;
    const d = gk===k ? 0 : (k.length>=4 && gk.length>=4 && lev(gk,k)<=1) ? 1 : (k.length>=3 && gk.startsWith(k)) ? 1 : 99;
    if(d<bd){ bd=d; best=i; } });
  return bd<99 ? best : -1;
}
function suggest(g){                                           // house the survey leans towards, or null on a tie
  if(!g || !g.c) return null; const t={G:0,H:0,R:0,S:0}; for(const ch of g.c) if(ch in t) t[ch]++;
  const r=Object.entries(t).sort((a,b)=>b[1]-a[1]); return r[0][1]>0 && r[0][1]>r[1][1] ? r[0][0] : null;
}
// Lines the Hat can say about this particular guest
function personalLines(g, house){
  if(!g) return {lines:[], target:null};
  const L=[];
  if(g.f) L.push(pick([`Hmm, I smell ${g.f}. Did you have ${g.f} for breakfast, {n}? Don't lie to a hat.`, `Ah, ${g.f}! A person of taste. A hat can tell these things.`]));
  if(g.a) L.push(pick([`Your favourite animal is ${g.a}. Of course it is. It suits you perfectly.`, `Mm, ${g.a}. I can see a little bit of ${g.a} in your eyes, {n}. Or is that just the light?`]));
  if(g.g) L.push(pick([`I hear you are rather good at ${g.g}. Hmm. That's a secret weapon, that is.`, `Ah, ${g.g}! I have a great many opinions about ${g.g}, and I'm keeping every one of them to myself.`]));
  if(g.p) L.push(pick([`And if you could have any magic power, you'd choose ${g.p}. Dangerous. Wonderful. Please don't test it on me.`, `Your wish is ${g.p}. That's quite a wish, {n}. I've heard worse. Mostly from goats.`]));
  const mine=[], others=[];
  [...(g.c||"")].forEach((ch,i)=>{ const q=CQ[i]&&CQ[i][ch]; if(!q) return; const t=pick(LEADS)+q; (ch===house?mine:others).push(t); });
  return { lines: shuffle(L.concat(others)), target: mine.length ? pick(mine) : null };
}

/* ---- Google Form / Sheet import ---- */
function parseTable(text){                                      // tab-separated (copied from Sheets) or CSV with quotes
  const delim = text.includes("\t") ? "\t" : ",", rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"' && cell==="") q=true;
    else if(ch===delim){ row.push(cell); cell=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cell); cell=""; if(row.some(c=>c.trim())) rows.push(row); row=[]; }
    else cell+=ch; }
  row.push(cell); if(row.some(c=>c.trim())) rows.push(row);
  return rows;
}
const CHOICE_RULES = [ [[/fling|open/i,"G"],[/friend/i,"H"],[/clue|read/i,"R"],[/shortcut|secret/i,"S"]],
                       [[/invite|loud/i,"G"],[/sit |company/i,"H"],[/work out|why/i,"R"],[/quiet|behind/i,"S"]],
                       [[/brave/i,"G"],[/kind/i,"H"],[/clever/i,"R"],[/give up|never/i,"S"]] ];
function toLetter(i, v){ v=(v||"").trim(); if(/^[GHRS]$/i.test(v)) return v.toUpperCase();
  const r=CHOICE_RULES[i].find(([re])=>re.test(v)); return r ? r[1] : "-"; }
function importSheet(text){
  const rows=parseTable(text.trim()); if(rows.length<2) return {err:"I need the header row plus at least one guest."};
  const head=rows[0].map(h=>h.toLowerCase());
  const col = res => { for(const re of res){ const i=head.findIndex(h=>re.test(h)); if(i>=0) return i; } return -1; };
  const C={ n:col([/call you/,/name/]), f:col([/food/]), a:col([/animal/]), g:col([/good at/]), p:col([/magic|power/]),
            c:[col([/door/]), col([/left out/]), col([/friends|say about/])] };
  if(C.n<0) return {err:"I can't find the name column. Is the header row included?"};
  const all=guests.get(); let added=0, updated=0;
  for(const r of rows.slice(1)){
    const n=clip(r[C.n],20); if(!n) continue;
    const g={ n, f:C.f>=0?clip(r[C.f],30):"", a:C.a>=0?clip(r[C.a],30):"", g:C.g>=0?clip(r[C.g],40):"", p:C.p>=0?clip(r[C.p],40):"",
              c:C.c.map((ci,i)=>ci>=0?toLetter(i,r[ci]):"-").join("") };
    const k=all.findIndex(x=>x.n.toLowerCase()===n.toLowerCase());
    if(k>=0){ all[k]=g; updated++; } else { all.push(g); added++; }       // a later submission replaces an earlier one
  }
  guests.set(all); renderGuests(); return {added, updated};
}
const sheetMsg = t => { $("sheetMsg").textContent=t; };
$("sheetImport").onclick = () => { const r=importSheet($("sheetPaste").value);
  if(r.err) return sheetMsg(r.err); sheetMsg(`Added ${r.added}, updated ${r.updated}.`); $("sheetPaste").value=""; };
try{ $("sheetUrl").value = localStorage.getItem("sheetUrl")||""; }catch{}
$("sheetFetch").onclick = async () => {
  let u=$("sheetUrl").value.trim(); if(!u) return sheetMsg("Paste the published CSV link first.");
  u=u.replace(/output=html/,"output=csv"); try{ localStorage.setItem("sheetUrl",u); }catch{}
  sheetMsg("Fetching…");
  try{ const res=await fetch(u); if(!res.ok) throw new Error(res.status); const r=importSheet(await res.text());
       sheetMsg(r.err || `Added ${r.added}, updated ${r.updated}.`); }
  catch{ sheetMsg("Could not fetch (this page may block outside links). Copy the sheet and use the paste box instead."); }
};

const store = { get(){ try{return JSON.parse(localStorage.getItem("sortedKids")||"[]")}catch{return []} },
                set(v){ try{localStorage.setItem("sortedKids",JSON.stringify(v))}catch{} } };

function pickHouse(who, matched){                          // host chooses the house (and which survey to use) on screen
  return new Promise(res=>{
    $("pickTitle").textContent=`Which house for ${who}?`;
    const all=guests.get(), sel=$("guestSel"); sel.innerHTML="";

    const label=()=>{ const s=suggest(all[+sel.value]); Object.keys(H).forEach(k=>{ btns[k].textContent=(s===k?"★ ":"")+H[k].name; }); };
    sel.onchange=label; label();

}

/* ================= THE SHOW ================= */
let name="", house=null, busy=false, museQueued=0;
const showMuse = () => { $("museBtn").textContent = museQueued ? `💭 Keep musing (${museQueued})` : "💭 Keep musing"; };
const fill = t => t.replace(/\{n\}/g, () => name);
const pick = pickOne;
async function getName(){
  let cand=null;
  for(let round=0; round<4; round++){
    if(cand===null){
      const r = await getAnswer(0, parseName, ["I didn't catch that. What is your name?","Speak up, young wizard! Your name?"], true);
      if(!r) return null; cand = r.name;
    }
    await sayChain([{t:`Did I hear… ${cand}?`},{t:"Say yes, or tell me your name again."}]);
    const c = await getAnswer(2, parseConfirm, ["Yes, or tell me your name again?"], true);
    if(c===0 || c===null) return cand;
    if(c===1){ cand=null; await say("Oh dear, my ears! Once more, what is your name?"); continue; }
    if(c && c.name) cand = c.name;
  }
  return cand;
}
async function runChild(){
  if(busy) return; busy=true; $("big").style.display="none"; $("table").style.display="none"; $("menu").open=false; setStatus("");
  $("bar").style.display="flex"; magic();
  await sayChain([{t:"Ahhh. At last, a head beneath me. Hmmmm…",s:"slow"},{t:"Tell me, young wizard, what is your name?"}]);
  name = (await getName()) || "Young Wizard";
  const choosing = pickHouse(name, matchGuest(name));                         // host picks while the Hat is talking
  await sayChain([{t:`${name}.`,s:"slow"},{t:"Splendid. Now keep very still while I think."}]);
  const picked = await choosing; house = picked.house;
  if(picked.guest) name = picked.guest.n;                       // use the spelling from their survey
  const P = personalLines(picked.guest, house), guest = picked.guest;
  const decoy = pick(Object.keys(H).filter(k=>k!==house));
  const n1 = pick(NEUTRAL), n2 = pick(NEUTRAL.filter(x=>x!==n1));
  const seg = [
    [{t: guest ? `Hmmmm… ${name}. Oh yes. I have heard whispers about you.` : `Hmmmm… ${name}. Yes. Yes, a head. And a very interesting one.`,s:"slow"}, {t:P.lines.shift()||n1}],
    [{t:"Let me see where you might belong…",s:"whisper"}, {t:pick(H[decoy].hints)}, {t:`Hmm. A touch of ${H[decoy].name}. Tempting. Very tempting.`,s:"whisper"}, {t:"But hold on, hold on…",s:"whisper"}, ...(P.lines.length?[{t:P.lines.shift()}]:[])],
    [{t:"Oh! What's this?"}, {t:pick(H[house].hints)}, {t:P.target||P.lines.shift()||n2}, {t:"Ohhh. That changes things. That changes everything."}],
    [{t:"Hm hm hm. Yes. No. Yes… Oh! I know exactly where to put you.",s:"slow"}, {t:"Better be…",s:"slow"}, {t:H[house].name.toUpperCase()+"!",s:"excited"}]
  ];
  murmur();
  const used = new Set(), fresh = pool => { const left=pool.filter(x=>!used.has(x)), t=pick(left.length?left:pool); used.add(t); return t; };
  const extraMuse = () => [{t:P.lines.length?P.lines.shift():fresh(TANGENTS)},{t:fresh(H[pick(Object.keys(H))].hints)},{t:fresh(DOUBTS),s:"whisper"}];
  museQueued = 0; skipSay = false; showMuse();
  $("museBtn").style.display="inline-block"; $("revealBtn").style.display="inline-block";
  for(let i=0; i<seg.length-1 && !skipSay; i++){                  // every segment except the reveal
    await sayChain(seg[i].map(c=>({...c,t:fill(c.t)})));
    while(!skipSay && museQueued>0){ museQueued--; showMuse(); await sayChain(extraMuse().map(c=>({...c,t:fill(c.t)}))); }
  }
  $("museBtn").style.display="none"; $("revealBtn").style.display="none";
  skipSay = false; museQueued = 0;                                  // reveal always plays in full
  await sayChain(seg[seg.length-1].map(c=>({...c,t:fill(c.t)})));
  fanfare();
  const all=store.get(); all.push({name,house,ts:Date.now()}); store.set(all);
  renderTable(); $("table").style.display="block";         // table appears as they're sorted
  await sleep(700);
  const h=H[house];
  await sayChain([{t:`${name}, you are ${h.traits.join(", ")}. Wear it proudly.`},{t:h.dare,s:"excited"},{t:"Next wizard, step forward!",s:"slow"}]);
  busy=false; $("bar").style.display="none"; $("museBtn").style.display="none"; $("revealBtn").style.display="none"; $("noiseBtn").textContent="🔇 Too noisy";
  $("big").textContent="Next child"; $("big").style.display="";
}
